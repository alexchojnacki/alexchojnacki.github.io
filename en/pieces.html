    <section class="pieces-header">
      <h1>Hand-thrown stoneware pieces</h1>
    </section>

    <section class="gallery">
      <div class="gallery-grid">
        <figure class="gallery-item">
          <a href="../images/29.jpg" data-lightbox>
            <picture>
              <source srcset="../images/29.webp" type="image/webp">
              <img src="../images/29.jpg" alt="Pyrite-speckled stoneware vase with thrown rings under a clear glaze" loading="lazy" width="900" height="1200" sizes="(max-width: 768px) 100vw, 480px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Thrown vase with pronounced rings, pyrite-speckled stoneware under a clear glaze: the colour comes from the clay and its iron flecks, not from the glaze.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/28.jpg" data-lightbox>
            <picture>
              <source srcset="../images/28.webp" type="image/webp">
              <img src="../images/28.jpg" alt="Pyrite-speckled stoneware table lamp under a clear glaze, lit on a sideboard" loading="lazy" width="900" height="1200" sizes="(max-width: 768px) 100vw, 480px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Table lamp thrown as two nested volumes, pyrite-speckled stoneware under a clear glaze, with the light spilling from the upper cup.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/24.jpg" data-lightbox>
            <picture>
              <source srcset="../images/24.webp" type="image/webp">
              <img src="../images/24.jpg" alt="Stack of deep green stoneware tumblers, one showing the maker's stamp" loading="lazy" width="1200" height="675" sizes="(max-width: 768px) 100vw, 960px">
            </picture>
          </a>
          <figcaption class="gallery-caption">A run of stoneware tumblers under a deep green glaze; the upturned foot shows the studio stamp pressed into every piece.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/30.jpg" data-lightbox>
            <picture>
              <source srcset="../images/30.webp" type="image/webp">
              <img src="../images/30.jpg" alt="Two stoneware planters with a textured grey glaze" loading="lazy" width="1200" height="1200" sizes="(max-width: 768px) 100vw, 480px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Two stoneware planters carrying the same textured grey glaze: the runs differ from one piece to the next out of the kiln.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/27.jpg" data-lightbox>
            <picture>
              <source srcset="../images/27.webp" type="image/webp">
              <img src="../images/27.jpg" alt="Stoneware planter with a textured grey glaze" loading="lazy" width="941" height="941" sizes="(max-width: 768px) 100vw, 480px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Stoneware planter with a pronounced shoulder; the grey glaze pulls back on the edges and leaves the bare clay showing.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/23.jpg" data-lightbox>
            <picture>
              <source srcset="../images/23.webp" type="image/webp">
              <img src="../images/23.jpg" alt="Candle poured into a ridged white stoneware pot" loading="lazy" width="1200" height="801" sizes="(max-width: 768px) 100vw, 960px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Candle poured into a stoneware pot with horizontal ridges; once the wax is gone the vessel lives on as a brush pot.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/25.jpg" data-lightbox>
            <picture>
              <source srcset="../images/25.webp" type="image/webp">
              <img src="../images/25.jpg" alt="Deep green stoneware brunch plate with avocado toast" loading="lazy" width="1599" height="1599" sizes="(max-width: 768px) 100vw, 480px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Brunch plate in speckled deep green glazed stoneware: the right size for toast, a poached egg and whatever goes around them.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/26.jpg" data-lightbox>
            <picture>
              <source srcset="../images/26.webp" type="image/webp">
              <img src="../images/26.jpg" alt="Unfired pieces on the studio shelves" loading="lazy" width="1024" height="1024" sizes="(max-width: 768px) 100vw, 480px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Unfired pieces waiting to be fired on the studio shelves: bowls, vases and pots all thrown from the same clay.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/22.jpg" data-lightbox>
            <picture>
              <source srcset="../images/22.webp" type="image/webp">
              <img src="../images/22.jpg" alt="Low deep green glazed stoneware serving bowl" loading="lazy" width="1200" height="800" sizes="(max-width: 768px) 100vw, 960px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Low thrown stoneware serving bowl, speckled deep green glaze breaking lighter at the rim: a shape that goes from kitchen to table.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/21.jpg" data-lightbox>
            <picture>
              <source srcset="../images/21.webp" type="image/webp">
              <img src="../images/21.jpg" alt="Four stoneware tumblers wrapped in tissue paper" loading="lazy" width="1200" height="1200" sizes="(max-width: 768px) 100vw, 480px">
            </picture>
          </a>
          <figcaption class="gallery-caption">An order of four tumblers wrapped in tissue paper, ready to ship: every parcel is packed by hand at the studio.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/20.jpg" data-lightbox>
            <picture>
              <source srcset="../images/20.webp" type="image/webp">
              <img src="../images/20.jpg" alt="Fluted stoneware tumbler in a deep green glaze, held in the hand" loading="lazy" width="1200" height="1200" sizes="(max-width: 768px) 100vw, 480px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Tumbler fluted on the wheel: the fine ribs hold the deep green glaze and give the piece its grip.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/4.jpg" data-lightbox>
            <picture>
              <source srcset="../images/4.webp" type="image/webp">
              <img src="../images/4.jpg" alt="Wall shelf filled with deep green stoneware" loading="lazy" width="2048" height="1152" sizes="(max-width: 768px) 100vw, 960px">
            </picture>
          </a>
          <figcaption class="gallery-caption">A shelf of deep green stoneware tableware: bowls, plates, tumblers and dishes from a single run of firings.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/10.jpg" data-lightbox>
            <picture>
              <source srcset="../images/10.webp" type="image/webp">
              <img src="../images/10.jpg" alt="Freshly fired glazed pieces in the open kiln" loading="lazy" width="360" height="640" sizes="(max-width: 768px) 100vw, 480px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Straight out of the firing: the glaze has vitrified and the pieces are still standing on the kiln shelves and props.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/9.jpg" data-lightbox>
            <picture>
              <source srcset="../images/9.webp" type="image/webp">
              <img src="../images/9.jpg" alt="Raw stoneware tumbler with a black glazed interior" loading="lazy" width="360" height="640" sizes="(max-width: 768px) 100vw, 480px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Small tumbler left raw on the outside and glazed black inside: bare clay set against a vitrified surface.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/3.jpg" data-lightbox>
            <picture>
              <source srcset="../images/3.webp" type="image/webp">
              <img src="../images/3.jpg" alt="Unfired tumblers and pots drying in the studio" loading="lazy" width="797" height="508" sizes="(max-width: 768px) 100vw, 960px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Throwing in series: unfired tumblers and pots dry before the bisque firing, in the greys and blacks of damp clay.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/8.jpg" data-lightbox>
            <picture>
              <source srcset="../images/8.webp" type="image/webp">
              <img src="../images/8.jpg" alt="Pencil sketch of a thrown bowl" loading="lazy" width="427" height="640" sizes="(max-width: 768px) 100vw, 480px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Preparatory pencil sketch: profile, foot and curve are worked out on paper before the piece goes on the wheel.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/5.jpg" data-lightbox>
            <picture>
              <source srcset="../images/5.webp" type="image/webp">
              <img src="../images/5.jpg" alt="Deep green glazed stoneware teapot" loading="lazy" width="480" height="640" sizes="(max-width: 768px) 100vw, 480px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Hand-thrown stoneware teapot: lid fitted to the body, spout and handle added by hand, all under a deep green glaze.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/12.jpg" data-lightbox>
            <picture>
              <source srcset="../images/12.webp" type="image/webp">
              <img src="../images/12.jpg" alt="Three speckled deep green glazed stoneware bud vases" loading="lazy" width="640" height="428" sizes="(max-width: 768px) 100vw, 960px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Three stoneware bud vases under a speckled deep green glaze, thrown as a series yet never identical; here with a dried umbel.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/2.jpg" data-lightbox>
            <picture>
              <source srcset="../images/2.webp" type="image/webp">
              <img src="../images/2.jpg" alt="Studio stamp pressed into the foot of a tumbler" loading="lazy" width="1024" height="1024" sizes="(max-width: 768px) 100vw, 480px">
            </picture>
          </a>
          <figcaption class="gallery-caption">The studio stamp, pressed into the clay under every piece before the first firing.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/1.jpg" data-lightbox>
            <picture>
              <source srcset="../images/1.webp" type="image/webp">
              <img src="../images/1.jpg" alt="Stoneware pitcher with a handle and speckled beige glaze" loading="lazy" width="797" height="786" sizes="(max-width: 768px) 100vw, 480px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Stoneware pitcher with a pulled handle, under a speckled beige glaze that deepens where it pools.</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../images/11.jpg" data-lightbox>
            <picture>
              <source srcset="../images/11.webp" type="image/webp">
              <img src="../images/11.jpg" alt="Small stoneware soy sauce dish with a speckled beige and deep green glaze" loading="lazy" width="640" height="428" sizes="(max-width: 768px) 100vw, 960px">
            </picture>
          </a>
          <figcaption class="gallery-caption">Small stoneware dish in a speckled beige and deep green glaze, sized for the soy sauce that goes alongside a plate of maki.</figcaption>
        </figure>
      </div>
    </section>
